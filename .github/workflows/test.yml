name: test

# REFERENCE COPY — this file lives in arcaeon-ledger as the canonical template for every
# arcaeon-* PYTHON package repo (arcaeon-audit, arcaeon-baseline, arcaeon-compact,
# arcaeon-continuity, arcaeon-dedup, arcaeon-distill, arcaeon-meter, arcaeon-once, and this
# one — arcaeon-ledger). It is written so the SAME BYTES can be copied verbatim into every
# repo's .github/workflows/test.yml with zero per-repo edits: every install/detect step is
# self-discovering (reads pyproject.toml, scans for a selftest.py) rather than hardcoding a
# package or repo name. See CI_SETUP_2026-08-16.md in velouria/projects/online_business/ for
# the full rollout runbook, cost estimate, and design notes (this file is staged, not pushed
# or enabled — copying it to the other 8 repos and enabling it is a separate authorized step).
#
# What it does, per push/PR: checkout -> setup-python (matrix: min + max supported version)
# -> editable-install the repo's own package -> pip install pytest + hypothesis (unconditional,
# since 2 of the 9 repos — arcaeon-dedup, arcaeon-meter — don't declare a [dev] extra) -> run
# the repo's own test_*.py suite with pytest -> auto-detect and run the package's own
# arcaeon_x/selftest.py if it ships one (5 of 9 repos do: baseline, compact, continuity,
# distill, ledger; 4 don't: all, audit, dedup, meter — both cases are handled without editing
# this file).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python = ">=3.9" declared across every arcaeon-* pyproject.toml.
        # Two points (oldest + newest supported) catch syntax/stdlib drift at both ends
        # without paying for a 4-5 point matrix on repos this small — see cost estimate in
        # the runbook for why this is deliberately narrow.
        python-version: ["3.9", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (editable) + test deps
        run: |
          python -m pip install --upgrade pip
          # Editable-install this repo's own package. Pulls its declared [project.dependencies]
          # (e.g. arcaeon-audit needs arcaeon-ledger) from PyPI — the published versions, which
          # is the same resolution a real `pip install arcaeon-x` would do. That means CI is
          # testing against the LAST PUBLISHED version of sibling arcaeon-* packages, not
          # whatever's sitting locally in a neighbor repo — a real gap, see runbook "known
          # limitation: no cross-repo dependency pinning in CI" for the tradeoff and options.
          pip install -e .
          # Installed unconditionally rather than via `pip install -e .[dev]` because two repos
          # in this line (arcaeon-dedup, arcaeon-meter) don't declare a [project.optional-
          # dependencies] dev extra at all — that install would hard-fail on those two.
          pip install pytest hypothesis

      - name: Run test suite
        run: |
          set +e
          pytest -q --tb=short
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            # Exit 5 = "no tests collected".
            #
            # This USED to exit 0 unconditionally, with an honest reason (one repo
            # in this line, arcaeon-all, is a dependency-umbrella meta-package with
            # no tests of its own) and a dishonest consequence: for the other eight
            # repos, a renamed file, a moved test directory, or a conftest import
            # error collects zero tests and renders IDENTICALLY to a clean run of
            # several hundred. "0 passed" and "0 looked at" printed the same green
            # check, at the layer that would hide every other check.
            #
            # An intentionally-empty suite is now DECLARED, not inferred. A repo
            # that genuinely ships no tests carries a `.no-tests` file saying why;
            # anything else that collects zero is a failure, loudly.
            if [ -f ".no-tests" ]; then
              echo "pytest collected zero tests, and .no-tests declares this repo"
              echo "intentionally ships none. Stated reason:"
              cat .no-tests
              exit 0
            fi
            echo "::error::pytest collected ZERO tests and this repo does not declare"
            echo "::error::itself test-free. This is a FAILURE, not a pass: a suite that"
            echo "::error::vanished (rename, moved dir, conftest import error) looks exactly"
            echo "::error::like a suite that passed. If this repo really has no tests, add a"
            echo "::error::.no-tests file stating why, so the exception is on the record."
            exit 1
          fi
          exit $code

      - name: Report how many tests actually ran
        # A count in the log is the cheapest defence against a suite quietly
        # shrinking: a green check says nothing about how much was checked.
        if: always()
        run: |
          set +e
          collected=$(pytest --collect-only -q 2>/dev/null | tail -1)
          set -e
          echo "collected: ${collected:-unknown}"

      - name: Run package selftest (if the package ships one)
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys

          # DISCOVERY USED TO STOP AT THE FIRST MATCH and required an __init__.py
          # beside the selftest. Both were silent coverage holes: a repo shipping
          # TWO selftests only ever ran one, and a component laid out without an
          # __init__.py (arcaeon-ledger/adapter/ is exactly this) was skipped
          # entirely — so its selftest, including a P0 fidelity check, has never
          # been executed by CI. A discovery loop that silently finds nothing is
          # the same "0 found / 0 looked at" shape as the exit-5 case above.
          # Now: scan one level deep, run EVERY selftest found, report the count,
          # and fail if ANY of them fails.
          root = pathlib.Path(".")
          found = []
          for child in sorted(root.iterdir()):
              if not child.is_dir() or child.name.startswith((".", "_")):
                  continue
              if (child / "selftest.py").exists():
                  found.append(child)
              # one level deeper, for components that live beside the package
              for sub in sorted(p for p in child.iterdir() if p.is_dir()) if child.is_dir() else []:
                  if sub.name.startswith((".", "_")):
                      continue
                  if (sub / "selftest.py").exists():
                      found.append(sub)

          if not found:
              print("No <package>/selftest.py in this repo — skipping (not an error; "
                    "several repos in this line don't ship one).")
              raise SystemExit(0)

          print(f"Discovered {len(found)} selftest(s): {[str(f) for f in found]}")
          failures = []
          for pkg in found:
              # Run as a MODULE from the package's PARENT directory. Building a
              # dotted path from the repo root instead (adapter.arcaeon_adapter)
              # is wrong whenever the intermediate directory is not itself a
              # package — which is exactly the case for the component this
              # discovery was widened to find. These selftests use relative
              # imports, so running the file directly fails too.
              parent = pkg.parent if str(pkg.parent) != "" else root
              if (pkg / "__init__.py").exists():
                  cmd = [sys.executable, "-m", f"{pkg.name}.selftest"]
              else:
                  cmd = [sys.executable, "selftest.py"]
                  parent = pkg
              print(f"Running: {' '.join(cmd)}  (cwd={parent})")
              if subprocess.run(cmd, cwd=str(parent)).returncode != 0:
                  failures.append(str(pkg))

          if failures:
              print(f"::error::selftest FAILED for: {failures}")
              raise SystemExit(1)
          print(f"All {len(found)} selftest(s) passed.")
          raise SystemExit(0)
          PY
